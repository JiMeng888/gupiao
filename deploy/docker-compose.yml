# ---------------------------------------------------------------------------
# 一键起全栈：MySQL 8 + Redis 7 + 后端 + 前端(Nginx)
#
# 用法：
#   cd deploy
#   export JWT_SECRET='至少32字符的随机串'     # 必须设置，否则后端启动即失败
#   export MYSQL_ROOT_PASSWORD='你的库密码'
#   export LLM_API_KEY='...'                  # 可选；不配则 AI 分析降级为规则引擎
#   docker compose up -d --build
#   浏览器打开 http://localhost:8088
#
# 首次启动时**不需要手工建表**：后端启动即由 Flyway 执行
# backend/src/main/resources/db/migration/mysql/ 下的版本化迁移。
#   - 全新数据卷          → 执行 V1 建表
#   - 已有表的旧数据卷    → 打基线跳过 V1，**已有数据原样保留**
# 详见 backend/src/main/resources/application.yml 的 spring.flyway 段。
# 升级既有部署只需 docker compose up -d --build，不必清库。
# ---------------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.0
    container_name: stocklab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 deploy/.env 或环境变量中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: stocklab
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 显式设置 wait_timeout：Hikari 的 max-lifetime(1700s) 必须小于它，
      # 否则连接会被服务端先掐断，表现为偶发的 "Communications link failure"
      - --wait-timeout=28800
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 只在需要从宿主机连库调试时暴露；生产环境建议删掉这一行。
      # 默认 3307 避开本机已有的 MySQL(3306)；容器间后端连 MySQL 走内部网络
      # mysql:3306，不经过这里，改宿主端口无影响。
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [stocklab]

  # ---------------------------------------------------------------------------
  # 说明：这里原本有一个 db-init 一次性容器负责建表。
  # 引入 Flyway 后已移除——因为「建表」这件事必须只有一个归属：
  # 两套机制并存时，db-init 会把表建出来、Flyway 只看到「结构非空」而打基线，
  # 结果是**谁都没有真正管过结构演进**，正是引入迁移工具想消灭的那种状态。
  #
  # 代价是应用账号现在需要 DDL 权限（Flyway 要建 flyway_schema_history 表
  # 并执行迁移）。若环境不允许，用 spring.flyway.user / spring.flyway.password
  # 指定独立的迁移账号，应用主连接仍保持只有 DML。
  #
  # 库本身由下面 mysql 服务的 MYSQL_DATABASE 创建（字符集取自
  # --character-set-server=utf8mb4），Flyway 不建库。
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: stocklab-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [stocklab]

  backend:
    build:
      context: ../backend
    container_name: stocklab-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      TZ: Asia/Shanghai

      # 数据库。后端读的是完整 JDBC URL（application-mysql.yml 的 ${DB_URL}），
      # 不是拆开的 DB_HOST/DB_PORT/DB_NAME——那三个变量后端根本不读。
      # 库名用 stocklab（与上面 mysql 服务的 MYSQL_DATABASE 一致）。
      DB_URL: jdbc:mysql://mysql:3306/stocklab?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      # Redis。后端用 Spring Boot 标准的 spring.data.redis 连接配置，
      # 环境变量名是 SPRING_DATA_REDIS_*（relaxed binding），不是 REDIS_HOST/REDIS_PORT。
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 让 Redis 容器真正被用上：会话吊销与限流都切到 Redis（多实例共享语义）。
      # 否则默认 memory store，Redis 容器白起。
      SESSION_STORE: redis
      RATE_LIMIT_STORE: redis

      # 必须显式设置：application.yml 读的是 APP_JWT_SECRET（不是 JWT_SECRET），
      # 缺失时应用会在启动阶段直接失败（@Size(min=32) 快速失败，这是有意的）
      APP_JWT_SECRET: ${JWT_SECRET:?必须在环境变量或 deploy/.env 中设置 JWT_SECRET（至少 32 字符）}

      # 可选。不配置时 AI 分析会降级为规则引擎，并在响应里如实标注
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}

      # 容器内不用 H2 控制台
      SPRING_H2_CONSOLE_ENABLED: "false"
    ports:
      # 宿主端口默认 18080 → 容器 8080。
      # 不用 8080 的原因：Docker Desktop(WSL2) 自身会占用宿主 8080（wslrelay /
      # com.docker.backend 进程），直接映射会报 "port is already allocated"。
      # 前端 nginx 反代走容器内部网络 backend:8080，不经过这里，改宿主端口无影响。
      - "${BACKEND_PORT:-18080}:8080"
    networks: [stocklab]

  frontend:
    build:
      context: ../frontend
    container_name: stocklab-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 宿主端口默认 8088 → 容器 80，避免与常见的 80 端口占用冲突
      - "${FRONTEND_PORT:-8088}:80"
    networks: [stocklab]

volumes:
  mysql-data:
  redis-data:

networks:
  stocklab:
    driver: bridge
