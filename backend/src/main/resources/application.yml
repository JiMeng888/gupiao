# ============================================================================
# 股票分析师系统 · 主配置
#
# 本文件只放「与环境无关」的配置。所有敏感项与随环境变化的值都通过环境变量
# 注入（写成 ${ENV_VAR:默认值}），默认值仅适用于本地开发。
#
# 启动前请先看两件事：
#   1. 默认 profile 是 dev（H2 内存库，零依赖即可拉起）。
#      连 MySQL 请用 --spring.profiles.active=mysql，并配好 DB_URL / DB_USERNAME / DB_PASSWORD。
#   2. APP_JWT_SECRET 在 dev 下有内置的开发密钥；其它 profile 必须显式提供，
#      否则会因为不满足 @Size(min=32) 而启动失败——这是刻意设计的快速失败。
# ============================================================================

server:
  port: 8080
  shutdown: graceful
  # 错误响应统一由 GlobalExceptionHandler 产出，不让容器再吐默认错误页，
  # 避免出现两套格式不同的错误体
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false

spring:
  application:
    name: stock-analyst-backend

  profiles:
    default: dev

  lifecycle:
    # 优雅停机：等正在处理的分析请求（可能 40 秒）跑完再退出。
    # 用 kill -9 强杀时该配置无效，容器环境请确保发 SIGTERM
    timeout-per-shutdown-phase: 45s

  jackson:
    # epoch 毫秒的时间戳由我们自己格式化，不使用全局日期序列化策略。
    # 只关掉「空字符串转 null 对象」的行为，避免前端传 "" 时静默变成 null
    deserialization:
      accept-empty-string-as-null-object: false

  # ---------------------------------------------------------------------------
  # 数据库结构演进（Flyway）
  #
  # 【为什么需要它】原方案靠 `CREATE TABLE IF NOT EXISTS` 手工建表。这套语句
  # 只会补建**缺失的表**，对已存在的表一个字段都不会加，却会正常退出并打印
  # 「建表完成」。于是「给实体加个字段」这件事的失败被推迟到运行时，
  # 以 `Unknown column` 的形式爆发，而排查起点是一个说成功了的部署脚本。
  #
  # 【如何做到「不丢已有数据」】两个配置项配合，覆盖两种部署情形：
  #
  #   * 全新空库：schema 为空 → Flyway 不打基线，从头执行 V1 建表。
  #   * 已有表的旧库（v1.0 之前由手工脚本建的，没有 flyway_schema_history）：
  #     直接 migrate 会因「schema 非空却无历史」而报错中止。
  #     `baseline-on-migrate: true` 让这种情况自动打一条基线记录，
  #     `baseline-version: 1` 声明「V1 视为已执行」——V1 被跳过，
  #     **既有表与数据原样保留**，只有 V2 起的迁移才会真正执行。
  #
  # 所以升级既有部署时不需要清库、不需要导出导入，直接启动即可。
  # ---------------------------------------------------------------------------
  flyway:
    # 迁移脚本按数据库厂商分目录。Flyway 会在运行期把 {vendor} 解析成
    # 当前数据库的厂商名（mysql / h2）。必须分开维护，因为 DDL 方言不同：
    # MySQL 有 ENGINE/CHARSET/COMMENT 与建表内联索引，H2 三者都不支持。
    locations: classpath:db/migration/{vendor}
    # 见上文「如何做到不丢已有数据」
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: 既有库基线（表结构由 V1 脚本等价创建）
    # 校验和不合规时直接失败而不是跳过。静默跳过被改动过的迁移，
    # 会让「开发机上是新的、生产库是旧的」这种偏差长期潜伏——
    # 那正是我们引入 Flyway 想消灭的东西。
    validate-on-migrate: true
    # 不建库。库的创建属于部署动作（compose 用 MYSQL_DATABASE、人工部署用
    # CREATE DATABASE），让应用顺手建库会掩盖「连错库」这类配置错误：
    # 库名写错时不是报错，而是安静地在另一个空库里建出一整套空表。
    create-schemas: false

app:
  jwt:
    # 仅从环境变量注入。HS256 需要至少 256 bit（32 字节）密钥
    secret: ${APP_JWT_SECRET:}
    issuer: stock-analyst
    access-token-ttl: 30m
    refresh-token-ttl: 30d

  market-data:
    # eastmoney：东方财富内部数据接口（真实行情）。
    # 「内部」指各财经网站给自家网页用的接口，未获数据方授权（详见 docs/数据来源与授权状态说明-20260924.md）
    # mock：内置确定性演示数据（离线可用，无网络依赖）
    provider: ${MARKET_DATA_PROVIDER:eastmoney}
    #
    # 降级链的优先级顺序（provider 非 mock 时生效）。兜底源 mock 不要写在这里——
    # 它由装配代码强制放在链尾，写进来会被忽略并打 WARN。
    #
    # 顺序可配的用途：东财存在 IP 级风控（服务端直接断连，实测 2026-09-19 / 09-21），
    # 触发后把腾讯提到第一位即可让报价/K 线/指数继续走真实数据，无需改代码重新发版。
    # 例：MARKET_DATA_CHAIN=tencent,eastmoney,tushare
    #
    #   各源能力差异：
    #   eastmoney —— 字段最全（搜索 / 个股榜单 / 全市场清单都有）
    #   tencent   —— 报价 / K 线 / 指数 / 一级行业板块榜；无搜索与个股榜单能力
    #   sina      —— 只有个股榜单（涨跌幅榜、成交额榜），不参与主链，见下方 movers-chain
    #   tushare   —— 有授权协议，但免费档仅日/周/月 K 线、指数、搜索；未配 TUSHARE_TOKEN 时不入链
    chain: ${MARKET_DATA_CHAIN:eastmoney,tencent,tushare}
    #
    # 板块榜的独立优先链（只影响 /quote/sectors，不影响报价/K线/搜索）。
    #
    # 为什么单独排：两个源的板块口径不同。东财行业板块接口返回 496 个板块，
    # 一级/二级/三级混在一起且没有层级字段——实测涨幅榜头部是「广告媒体」
    # （3 只成分股）「其他数字媒体」（2 只），还伴随「电视广播Ⅲ / Ⅱ」
    # 「林业Ⅲ / Ⅱ」这类同板块跨层级重复条目，对「资金往哪去」没有解释力。
    # 腾讯返回的是 31 个一级行业，成分股规模相当，天然可比。
    #
    # 想把板块也交回东财，改成 MARKET_DATA_SECTOR_CHAIN=eastmoney,tencent 即可。
    sector-chain: ${MARKET_DATA_SECTOR_CHAIN:tencent,eastmoney}
    #
    # 个股榜单的独立优先链（只影响 /quote/movers 的涨跌幅榜与成交额榜）。
    #
    # 与板块链相反，东财排在前面：这里的差异不是口径而是「有没有」。
    # 腾讯的个股榜接口实测返回空列表（{"rank_list":[],"total":0}），
    # 所以此前榜单只有东财一家真实源，东财一被风控，首页「今日涨幅榜」就整块
    # 变成「市场榜单暂不可用」。新浪补上了这一级：node=hs_a 覆盖与东财
    # 完全相同的五个板块（沪深主板/创业板/科创板/北交所），两家的上榜名单可直接互换。
    #
    # 新浪为什么不在 chain 里：本项目只实现了它的榜单能力，
    # 放进主链会让每次报价/K 线降级都多走一次注定失败的调用。
    movers-chain: ${MARKET_DATA_MOVERS_CHAIN:eastmoney,sina}
    # 单次行情请求超时。设得比页面等待时间短，宁可降级也不要挂住线程
    timeout: 6s
    # 真实源请求失败后的冷却时长：冷却期内跳过该源直接用下一级，
    # 到期自动放行探测。避免上游被风控/宕机时每个请求都先白等一次失败。
    # 设为 0s 禁用。
    upstream-cooldown: 30s
    # 报价缓存 3 秒：把同一秒内「首页 N 个组件各自取价」折叠成一次上游请求
    quote-ttl: 3s
    # K 线缓存 5 分钟：日内不频繁变化
    bar-ttl: 5m
    # 启动后异步预热全 A 股代码清单（搜索依赖它）。
    # 用 ApplicationReadyEvent 触发，不拖慢启动
    # 极低配机器（如 0.1 vCPU 的免费档）可设为 false 换取更轻的启动开销，
    # 代价是搜索接口在预热完成前返回空列表
    warmup-on-boot: ${MARKET_DATA_WARMUP_ON_BOOT:true}
    # 上游故障时降级为演示数据。开启后接口不会因上游抖动而整体不可用，
    # 但响应里会标记数据源，前端需据此提示用户
    fallback-to-mock: true
    #
    # 对外「声明」的行情延迟分钟数，0 表示实时。
    #
    # 合规要求：使用非实时行情时，必须在价格附近明示延迟时长。
    # 本项目默认接的公开接口在交易时段返回实时价，故默认 0；
    # 若换成明确延迟的行情源（很多免费/延迟源是 15 分钟），必须在这里改，
    # 前端会据此在价格旁渲染「延迟 N 分钟」标注。
    #
    # 注意这是声明值不是实测值：「数据是否新鲜」由快照时间戳 ts 判断，
    # 两者覆盖不同的问题，互不替代。
    quote-delay-minutes: ${MARKET_DATA_QUOTE_DELAY_MINUTES:0}

  llm:
    # deepseek / qwen / openai / mock
    provider: ${LLM_PROVIDER:deepseek}
    # 留空则始终走规则化报告（不产生任何外部费用）
    api-key: ${LLM_API_KEY:}
    # 覆盖服务商默认地址。注意不要带 /v1 后缀，路径由代码拼接
    base-url: ${LLM_BASE_URL:}
    model: ${LLM_MODEL:}
    # 大模型生成长文本需要 10~40 秒，与行情源的 6 秒完全不同量级
    timeout: 45s
    max-tokens: 1500

  analysis:
    # 报告存档的有效期。超过它的历史报告不再被当作「最新结论」返回，会重新生成。
    #
    # 为什么必须有这个窗口：报告正文是自然语言，里面写着
    # 「最新价 1685.00，当日 +1.23%」——生成那一刻的价格被固化成了文字。
    # 没有窗口时这份报告会被无限期当作「最新」复用，用户看到的是一句
    # 自称「最新」的历史数据，且报告本身没有过期标注。
    #
    # 默认 6 小时：A 股一个交易日的交易时长是 4 小时，6 小时足够覆盖
    # 「同一次会话里反复查看同一只标的」这个主要复用场景，
    # 又不会让报告跨过两个交易日还在冒充最新。
    # 设为 0 表示不限时效（旧行为，不建议）。
    archive-max-age: ${ANALYSIS_ARCHIVE_MAX_AGE:6h}
    #
    # 异步任务（analysis_tasks）的保留时长。超过它的【终态】任务会被定时清理。
    # PENDING / RUNNING 永远不会被删——那会把正在执行的任务状态行删掉，
    # 后台线程稍后写回时更新到 0 行，任务对提交方凭空消失。
    #
    # 为什么要清理：这张表带 report_json（单条可达数 KB），终态之后对业务没有用途
    # （报告已写进 ai_reports），不清理就是纯增长。默认 3 天，远大于用户等结果的时长。
    # 设为 0 关闭清理。
    task-retention: ${ANALYSIS_TASK_RETENTION:3d}
    # 清理任务的执行间隔（fixedDelay：上一轮结束后再等这么久）
    cleanup-interval: ${ANALYSIS_CLEANUP_INTERVAL:6h}
    # 首次执行延迟。fixedDelay 默认启动即执行，而启动阶段本来就在抢数据库连接
    cleanup-initial-delay: ${ANALYSIS_CLEANUP_INITIAL_DELAY:5m}

  tushare:
    # Tushare Pro 个人 Token（有授权协议的数据源，注册 tushare.pro 获取）。
    # 留空则 Tushare 数据源不加入降级链（东财/腾讯被风控时直接落演示数据）。
    # 免费档覆盖日/周/月 K 线、指数、股票搜索；不提供盘中实时报价与榜单。
    token: ${TUSHARE_TOKEN:}
    base-url: ${TUSHARE_BASE_URL:http://api.tushare.pro}
    timeout: 10s

  session:
    # memory：单副本内存黑名单（默认）；redis：多实例共享，登出跨实例立即生效。
    #
    # 为什么默认是 memory 而不是 redis：redis 会引入一个运行时依赖，
    # 默认值不该让「不配任何东西直接启动」失败。
    # 但代价必须说清楚——**默认配置下多副本部署时，在 A 实例登出的会话
    # 拿到 B 实例仍然可用**。启动日志里会为此打 WARN，别忽略它。
    store: ${SESSION_STORE:memory}
    key-prefix: stockanalyst:revoked

  rate-limit:
    enabled: true
    # memory：单机内存令牌桶（默认）；redis：多实例共享配额（需 Redis 可用）
    store: ${RATE_LIMIT_STORE:memory}
    key-prefix: stockanalyst
    # 严格桶：登录注册、写操作、AI 分析
    strict-rate-per-min: 20
    strict-burst: 10
    # 宽松桶：行情、K 线、指标、资讯等只读接口
    # 单个详情页会并发发起十几个请求，桶开得太小会误伤正常使用
    loose-rate-per-min: 600
    loose-burst: 120
    # 是否信任 X-Forwarded-For。默认关闭：该请求头由客户端完全可控，
    # 未部署在受信反代之后时开启等于直接给出绕过限流的方法。
    # 开启前请确认反代使用 proxy_set_header X-Forwarded-For $remote_addr（覆盖而非追加）
    #
    # 为什么必须可配置：容器部署时后端只被 nginx 访问，getRemoteAddr() 拿到的是
    # nginx 容器的内网 IP——**所有外部用户共用同一个桶**。此时若不开启，
    # 严格桶 20 次/分钟会被几个人很快打满，表现为「登录和 AI 分析随机 429」。
    # docker-compose.lite.yml 与主 compose 都把它置为 true，前提是 nginx.conf
    # 已改为 $remote_addr 覆盖（本仓库已改）。
    trust-forwarded-header: ${RATE_LIMIT_TRUST_FORWARDED:false}
    client-ip-header: X-Forwarded-For

  cors:
    # 使用 patterns 而非固定列表：allowCredentials=true 时不允许 Access-Control-Allow-Origin: *，
    # 用 pattern 才能按请求 Origin 回显具体值
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
    allow-credentials: true
    max-age-seconds: 3600

  ws:
    # 实时行情推送间隔。定时任务用 fixedDelay，上一轮结束后再等这个时间，
    # 负载变高时推送周期会自动拉长而不是堆积
    push-interval: 3s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    # 行情接口的响应体较长，默认的折叠深度不利于调试
    default-models-expand-depth: 1
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        # prometheus 需要 micrometer-registry-prometheus（已引入）
        include: health,info,metrics,prometheus
  health:
    redis:
      # Redis 在本项目里是可选依赖：只有 app.rate-limit.store=redis 时才用到。
      # spring-data-redis 在 classpath 上会让 Boot 自动注册 Redis 健康检查，
      # 本机没装 Redis 时整体状态就变成 DOWN，容器编排与负载均衡会误判
      # 这个服务已经不可用。因此默认关闭；真正启用 Redis 限流时再打开。
      enabled: false
  endpoint:
    health:
      # 默认不暴露数据库/磁盘等细节，避免健康检查端点成为信息泄漏面
      show-details: never
  metrics:
    tags:
      application: stock-analyst
    distribution:
      # 打开 HTTP 分位统计，便于判断「AI 分析接口把 P99 拉到了多少」
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    com.stocklab.analyst: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
