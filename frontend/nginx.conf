# ---------------------------------------------------------------------------
# Nginx 配置：托管前端静态资源 + 反向代理后端
#
# 前端镜像里没有 Vite 开发服务器，开发环境那套 proxy（见 vite.config.ts）
# 在生产完全不生效。必须在 Nginx 上重新配一遍 /api 与 /ws 的转发，
# 否则会得到「前端页面能打开但所有接口 404」——这是部署时最常见的坑。
# ---------------------------------------------------------------------------

upstream stock_backend {
    # backend 是 docker-compose 里的服务名，由 Docker 内置 DNS 解析。
    # 用服务名而不是固定 IP：容器重建后 IP 会变。
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    # 压缩。text/html 由 nginx 默认 gzip_types 之外，需显式加上
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ------------------------------------------------------------------
    # 单页应用路由回退
    #
    # Vue Router 用的是 history 模式（createWebHistory），
    # 直接刷新 /stock/600519 时 Nginx 会去找名为 stock 的目录并返回 404。
    # try_files 让它回退到 index.html，由前端路由接管。
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源可以长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 后端 API
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://stock_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 行情与 AI 研判都可能较慢：上游接口超时或大模型生成耗时较长，
        # 默认 60s 会在长尾请求上产生 504。AI 分析链路最长，
        # 这里给到 120s，与后端 LlmProperties 的 timeout(45s) + 重试留出余量。
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ------------------------------------------------------------------
    # WebSocket 实时行情
    #
    # 三处缺一不可：
    #   1. Upgrade / Connection 头必须透传，否则握手失败（返回 400）
    #   2. proxy_read_timeout 必须远大于推送间隔（后端每 3 秒一帧），
    #      设置为 60s 时有 20 次推送的容错余量
    #   3. proxy_buffering off，否则帧会被 Nginx 缓冲、失去实时性
    # ------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://stock_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 健康检查不写访问日志，避免刷屏
    location = /actuator/health {
        proxy_pass http://stock_backend;
        access_log off;
    }
}
