# ============================================================================
# mysql profile：MySQL 8
#
# 前置步骤：
#   1. 建库（字符集必须是 utf8mb4，否则股票名称与资讯标题里的生僻字会报错）：
#        CREATE DATABASE stocklab
#          DEFAULT CHARACTER SET utf8mb4
#          DEFAULT COLLATE utf8mb4_0900_ai_ci;
#      库名任意，只要与下面 DB_URL 里的一致即可。
#      注意：迁移脚本不建库（spring.flyway.create-schemas=false），
#      建库属于部署动作。
#   2. **不需要手工建表**：应用启动时由 Flyway 自动执行
#      src/main/resources/db/migration/mysql/ 下的版本化迁移。
#        - 全新空库            → 执行 V1 建表
#        - 已有表的旧库        → 打基线跳过 V1，**已有数据原样保留**
#                               （见 application.yml 的 baseline-on-migrate）
#        - 之后新增字段        → 在迁移目录里新增 V2__xxx.sql
#      想先看建表语句可以直接读 V1__baseline.sql，它也能手工执行
#      （语句都是 IF NOT EXISTS，重复执行安全）。
#   3. 权限：结构演进由应用启动时的 Flyway 完成，因此应用账号需要 DDL 权限。
#      若环境要求应用只有 DML，请用 spring.flyway.user / spring.flyway.password
#      指定一个独立的迁移账号，主连接保持最小权限。
#   4. 设置环境变量后启动：
#        SPRING_PROFILES_ACTIVE=mysql
#        DB_URL=jdbc:mysql://localhost:3306/stocklab?...
#        DB_USERNAME=...
#        DB_PASSWORD=...
#        APP_JWT_SECRET=<至少 32 字符的随机串>
# ============================================================================

spring:
  datasource:
    # rewriteBatchedStatements=true：开启批量插入的语句合并，写入吞吐提升明显
    # serverTimezone=Asia/Shanghai：显式声明，避免驱动按 JVM 默认时区解释时间
    # useSSL=false：本地/内网环境下的常见设置；跨公网请改为 true 并配置证书校验
    url: ${DB_URL:jdbc:mysql://localhost:3306/stock_analyst?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

    hikari:
      # 连接池上限。经验值：CPU 核数 × 2 + 磁盘数；超过后吞吐不再提升，
      # 反而因为上下文切换与锁竞争下降。MySQL 的 max_connections 也要留出余量
      maximum-pool-size: 20
      minimum-idle: 5
      # 连接最大存活时间必须小于 MySQL 的 wait_timeout（默认 8 小时），
      # 否则会拿到已被服务端关掉的连接，表现为偶发「Communications link failure」
      max-lifetime: 1_700_000
      connection-timeout: 5_000
      # 只读事务的自动提交开关：交给 Spring 的 @Transactional(readOnly) 处理
      auto-commit: true

  sql:
    init:
      # 建表已交给 Flyway（见类头说明）。这里保留 never 是显式声明意图：
      # 即使将来有人在 db/ 下放一个 schema.sql，也不会被意外执行。
      mode: never

# MySQL 下关闭 H2 控制台（dev profile 里的配置不会生效，这里显式声明意图）
  h2:
    console:
      enabled: false

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid

management:
  endpoint:
    health:
      # 生产环境只给聚合状态，不暴露数据库连接串等细节
      show-details: never

logging:
  level:
    com.stocklab.analyst: INFO
